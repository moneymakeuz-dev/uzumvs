name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karto
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: karto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U karto -d karto" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://karto:ci-only-password@127.0.0.1:5432/karto
      TEST_DATABASE_URL: postgresql+psycopg://karto:ci-only-password@127.0.0.1:5432/karto_test
      E2E_DATABASE_URL: postgresql+psycopg://karto:ci-only-password@127.0.0.1:5432/karto_e2e
      AI_PROVIDER: mock
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci --no-audit --no-fund
      - name: Lint
        run: python -m ruff check app tests
      - name: Create test databases
        run: |
          PGPASSWORD=ci-only-password createdb -h 127.0.0.1 -U karto karto_test
          PGPASSWORD=ci-only-password createdb -h 127.0.0.1 -U karto karto_e2e
      - name: Migrations apply on an empty database
        run: python -m alembic upgrade head
      - name: Python tests
        run: python -m pytest -q -W error::sqlalchemy.exc.SAWarning
      - name: Build assets
        run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          E2E_PYTHON=python npx playwright test
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -t karto-studio:ci .
      - name: Verify image runs as non-root with operator tools
        run: docker run --rm --entrypoint sh karto-studio:ci -c 'test "$(id -u)" = 10001 && pg_dump --version && karto --help'
      - name: Validate production compose file
        run: POSTGRES_PASSWORD=validation DOMAIN=example.invalid APP_ENV_FILE=.env.example docker compose config --quiet
