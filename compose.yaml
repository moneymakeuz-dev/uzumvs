name: karto

x-app: &app
  image: ${APP_IMAGE:-karto-studio:latest}
  build: .
  env_file: ${APP_ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql+psycopg://karto:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/karto
    UPLOAD_DIR: /app/var/uploads
    MAIL_DIR: /app/var/mail
    BACKUP_DIR: /app/var/backups
    AUDIT_LOG: /app/var/audit/audit.log
    FORWARDED_ALLOW_IPS: 172.30.10.10
  volumes:
    - appdata:/app/var
  networks: [data, edge]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: karto
      POSTGRES_DB: karto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karto -d karto"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *app
    command: ["karto", "web", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4

  worker:
    <<: *app
    command: ["karto", "worker"]
    stop_grace_period: 150s
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "karto", "worker-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ops:
    <<: *app
    command: ["karto", "scheduler"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {ipv4_address: 172.30.10.10}
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped

networks:
  data:
    internal: true
  edge:
    ipam:
      config: [{subnet: 172.30.10.0/24}]

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
