# selleragent.uz serveri: tashqi nginx + certbot ishlatiladi, shuning uchun caddy ishga tushirilmaydi.
# docker compose -f compose.yaml -f deploy/compose.selleragent.yaml up -d web worker ops
services:
  db:
    mem_limit: 512m
  migrate:
    environment:
      FORWARDED_ALLOW_IPS: 172.30.10.1
  web:
    ports: ["127.0.0.1:8095:8000"]
    shm_size: 256m
    mem_limit: 1536m
    cpus: 1.5
    environment:
      FORWARDED_ALLOW_IPS: 172.30.10.1
  worker:
    mem_limit: 512m
    environment:
      FORWARDED_ALLOW_IPS: 172.30.10.1
  ops:
    mem_limit: 384m
    environment:
      FORWARDED_ALLOW_IPS: 172.30.10.1
