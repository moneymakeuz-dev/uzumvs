[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "karto-studio"
version = "0.1.0"
description = "Bilingual product card workspace for Uzum sellers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "jinja2>=3.1.5,<4",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26",
  "pillow>=11,<13",
  "openpyxl>=3.1.5,<4",
  "google-genai>=1.20,<2",
  "limits>=5.1,<6",
  "python-dotenv>=1.0,<2",
  "aiosmtplib>=3,<6",
  "httpx>=0.28,<1",
  "tzdata>=2025.1",
  "cryptography>=44",
  "boto3>=1.35,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1", "pip-tools>=7.4,<8"]

[project.scripts]
karto = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*", "ai/*.json"]

[tool.pytest.ini_options]
addopts = "--tb=short"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
